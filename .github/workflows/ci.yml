name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run server tests
        run: npm test --prefix server

      - name: Run client tests
        run: npm test --prefix client

      - name: Run deployment checks
        run: node --test deploy/tests/*.test.cjs

      - name: Build client
        run: npm run build --prefix client

      - name: Package tested frontend and deployment helpers
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/COMMIT"
          tar --exclude=deploy/tests --exclude=deploy/LOCAL_SETUP.md -czf deployment.tgz deploy client/dist -C "$RUNNER_TEMP" COMMIT

      - name: Upload deployment artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: deployment.tgz
          retention-days: 7

  secret-scan:
    name: Scan secrets in full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks CLI
        run: bash .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Verify scanner detection and checksum rejection
        run: bash .github/scripts/test-secret-scanning.sh "$RUNNER_TEMP/gitleaks/gitleaks"

      - name: Scan all committed history with redacted output
        run: bash .github/scripts/scan-secrets.sh "$RUNNER_TEMP/gitleaks/gitleaks"

  deploy:
    name: Deploy to production
    needs: [test-and-build, secret-scan]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download tested frontend and deployment helpers
        uses: actions/download-artifact@v4
        with:
          name: deployment-${{ github.sha }}

      - name: Skip a superseded revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer revision is on master; skipping this deployment.'
          fi

      - name: Deploy and verify
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
          DEPLOY_PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash .github/scripts/deploy-ssh.sh
