name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run server tests
        run: npm test --prefix server

      - name: Build client
        run: npm run build --prefix client

  secret-scan:
    name: Scan secrets in full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks CLI
        run: bash .github/scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Verify scanner detection and checksum rejection
        run: bash .github/scripts/test-secret-scanning.sh "$RUNNER_TEMP/gitleaks/gitleaks"

      - name: Scan all committed history with redacted output
        run: bash .github/scripts/scan-secrets.sh "$RUNNER_TEMP/gitleaks/gitleaks"
